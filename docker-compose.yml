version: '3.8'
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: guestflow
      POSTGRES_PASSWORD: guestflow_password
      POSTGRES_DB: guestflow_db
    ports:
      - "5432:5432"
    volumes:
      - guestflow_pgdata:/var/lib/postgresql/data

volumes:
  guestflow_pgdata:
